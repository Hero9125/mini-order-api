version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mini-order-api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=mini_order_api
      - DB_USERNAME=mini_order
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MAIL_HOST=mailhog
      - MAIL_PORT=1025
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - mini-order-network

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: mini_order_api
      MYSQL_USER: mini_order
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - mini-order-network

  redis:
    image: redis:6.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mini-order-network

  mailhog:
    image: mailhog/mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - mini-order-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=database
    volumes:
      - .:/var/www/html
    depends_on:
      - db
      - redis
    networks:
      - mini-order-network

volumes:
  db_data:
  redis_data:

networks:
  mini-order-network:
    driver: bridge
